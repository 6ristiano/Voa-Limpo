<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Entrar</title>
  </head>
  <body>
    <h1>Voa Limpo – Login</h1>

    {% if form.errors %}
      <p style="color:#b00;">Usuário ou senha inválidos.</p>
    {% endif %}

    <form method="post">
      {% csrf_token %}
      <p>
        <label>Usuário</label><br>
        {{ form.username }}
      </p>
      <p>
        <label>Senha</label><br>
        {{ form.password }}
      </p>
      <button type="submit">Entrar</button>
    </form>
  </body>
</html>
